name: CI

# Runners available on this Forgejo instance:
#   macos-arm64 — native macOS, Swift toolchain on the host
#   docker      — Raspberry Pi (ARM64 Linux), container backend
#
# The Linux job is the one that enforces the project's purity constraints:
# Foundation, Darwin and CGFloat are unavailable or behave differently there,
# so an inadvertent import fails to COMPILE rather than merely being tut-tutted
# in review. See CLAUDE.md § Technology Constraints.
#
# NOTE ON CHECKOUT — why there is no `uses: actions/checkout@vN` here.
# actions/checkout is a JavaScript action: the runner downloads it and then
# executes it with `node` INSIDE the job container. Neither alpine nor the
# official swift image ships Node, so the action dies with
#   OCI runtime exec failed: exec: "node": executable file not found in $PATH
# (exit 127) before a single step of ours runs. Rather than pull Node into
# every container purely to run a clone, each job clones with plain git.
# Requires no Node on any runner and behaves identically on macOS and Linux.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  constraints:
    name: Purity constraints
    runs-on: docker
    container: alpine:3.20
    steps:
      - name: Install git
        run: apk add --no-cache git

      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Workspaces can be reused; start from a clean directory.
          rm -rf ./* ./.[!.]* 2>/dev/null || true
          HOST="${GITHUB_SERVER_URL#https://}"
          if [ -n "$TOKEN" ]; then CREDS="x-access-token:${TOKEN}@"; else CREDS=""; fi
          git clone "https://${CREDS}${HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout -q "${GITHUB_SHA}"
          git log -1 --oneline

      # PORTABILITY, and why every gate below looks the way it does.
      #
      # This job runs on alpine, whose grep is BusyBox. BusyBox grep has NO
      # `--include` option: it dies with "unrecognized option" and a usage dump.
      # Every gate here was originally written as `if grep --include=... ; then`,
      # which is FAIL-OPEN — grep errors, exits non-zero, the `if` is false, and
      # the step cheerfully prints OK. Three gates passed that way without ever
      # reading a file. The __SCAFFOLD__ gate is the one that mattered: Foundation
      # and CGFloat are also caught at compile time by test-linux, but a leftover
      # scaffold marker has no other backstop.
      #
      # The portable form is `find … -name '*.swift' -exec grep … {} +`, captured
      # into a variable. Note `find -exec … +` returns FIND's status, not grep's,
      # so the `if grep` idiom cannot be reused — test the captured output instead.
      #
      # Each gate first asserts it can see files at all. A check that inspected
      # nothing must fail, not pass: "no matches" and "no input" are different
      # answers and only one of them is good news.
      - name: No Foundation / Darwin / Glibc imports in Sources
        run: |
          COUNT=$(find Sources -name '*.swift' | wc -l)
          [ "$COUNT" -gt 0 ] || { echo "ERROR: gate found no .swift files under Sources/ — it cannot have checked anything"; exit 1; }
          # Anchored to a real import statement, so prose mentioning
          # "Foundation" in a comment does not trip the gate.
          HITS=$(find Sources -name '*.swift' -exec grep -nE '^[[:space:]]*import[[:space:]]+(Foundation|Darwin|Glibc)' {} + || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "ERROR: Foundation/Darwin/Glibc import in Sources/ — forbidden by CLAUDE.md"
            exit 1
          fi
          echo "OK — no Foundation/Darwin/Glibc imports ($COUNT files checked)"

      - name: Float geometry only — no CGFloat, no Double
        run: |
          COUNT=$(find Sources -name '*.swift' | wc -l)
          [ "$COUNT" -gt 0 ] || { echo "ERROR: gate found no .swift files under Sources/ — it cannot have checked anything"; exit 1; }
          # Strip trailing line comments before matching, otherwise the comment
          # in LayoutTypes.swift ("no CGFloat, no Foundation") is a false positive.
          HITS=$(find Sources -name '*.swift' -exec grep -nE '\bCGFloat\b|\bDouble\b' {} + \
                   | sed 's|//.*||' \
                   | grep -E '\bCGFloat\b|\bDouble\b' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "ERROR: CGFloat/Double in Sources/ — Float geometry only (CLAUDE.md)"
            exit 1
          fi
          echo "OK — Float geometry only ($COUNT files checked)"

      - name: No scaffold markers left behind
        run: |
          COUNT=$(find Sources -name '*.swift' | wc -l)
          [ "$COUNT" -gt 0 ] || { echo "ERROR: gate found no .swift files under Sources/ — it cannot have checked anything"; exit 1; }
          # DISTILL writes __SCAFFOLD__ into RED stubs; DELIVER must remove them.
          HITS=$(find Sources -name '*.swift' -exec grep -n '__SCAFFOLD__' {} + || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "ERROR: __SCAFFOLD__ marker in Sources/ — an unfinished DELIVER step"
            exit 1
          fi
          echo "OK — no scaffold markers ($COUNT files checked)"

      # SCOPE (ODQ-VT-07, resolved NO): this check scans Sources/GameUI/ ONLY and must
      # not be widened to Sources/GameUITesting/. Widening would make one module's
      # comment block authoritative over another module's declarations — the exact
      # knowledge-locality objection on which ADR-006 rejected Alternative A, inverted.
      # The realistic failure there ("GameUITesting grows a traversal chain") is covered
      # by name by the no-dispatch-cast step below. A child-bearing View in GameUITesting
      # could not work anyway (it needs a layoutNode branch it cannot add), while a
      # composite one is handled free by the V.Body.self != Never.self fallback.
      # REVISIT TRIGGER: the first ': View' conformance declared anywhere under
      # Sources/GameUITesting/.
      - name: Traversal registry covers every View type
        run: |
          # Declared View conformances in Sources/GameUI/.
          # 18/18 recall on the current corpus, zero false positives.
          # \bView\b does not match inside "ContainerView"/"ZStackView" (no word
          # boundary before the capital V), so protocol conformances alone do not trip it.
          # find … -exec, not grep --include: BusyBox grep has no --include (see the
          # portability note above the first gate in this job).
          find Sources/GameUI -name '*.swift' -exec grep -hoE '^(public )?(struct|enum|final class) [A-Za-z0-9_]+(<[^>]*>)?: *[A-Za-z, ]*\bView\b' {} + \
            | sed -E 's/^(public )?(struct|enum|final class) ([A-Za-z0-9_]+).*/\3/' \
            | sort -u > /tmp/declared.txt

          # A declared list this short means the extractor broke, not that the module
          # emptied out. Without this the gate still fails — every registry line looks
          # STALE — but it blames the registry for a tooling fault. Fail with the truth.
          DECLARED_COUNT=$(wc -l < /tmp/declared.txt)
          if [ "$DECLARED_COUNT" -lt 10 ]; then
            echo "ERROR: only $DECLARED_COUNT View conformances extracted from Sources/GameUI/."
            echo "The corpus has 18. This is an extractor failure, not a registry error."
            exit 1
          fi

          # ALLOWLIST. `extension Never: View` (Sources/GameUI/View.swift:9) is the only
          # conformance declared in an extension and is invisible to the regex by
          # construction. Allowlisted deliberately rather than widening the pattern —
          # see ADR-006 Alternative G. If a SECOND extension-declared or conditional
          # conformance ever appears, that is the trigger to revisit the SwiftSyntax option.
          echo "Never" >> /tmp/declared.txt
          sort -u -o /tmp/declared.txt /tmp/declared.txt

          # Registry annotations: '// traversal: <Type> children <Accessor>' or '// traversal: <Type> leaf'
          grep -hoE '^// traversal: [A-Za-z0-9_]+' Sources/GameUI/ViewTraversal.swift \
            | awk '{print $3}' | sort -u > /tmp/registered.txt

          MISSING=$(comm -23 /tmp/declared.txt /tmp/registered.txt)
          if [ -n "$MISSING" ]; then
            echo "ERROR: View-conforming types with no traversal registry entry:"
            echo "$MISSING"
            echo "Add '// traversal: <Type> children <Protocol>.<accessor>' or '// traversal: <Type> leaf'"
            echo "to Sources/GameUI/ViewTraversal.swift — and a branch to childViews(of:) if it bears children."
            exit 1
          fi

          STALE=$(comm -13 /tmp/declared.txt /tmp/registered.txt)
          if [ -n "$STALE" ]; then
            echo "ERROR: traversal registry names types that no longer exist:"
            echo "$STALE"
            exit 1
          fi

          echo "OK — traversal registry covers all $(wc -l < /tmp/declared.txt) View-conforming types"

      # The alternation pipes below are UNESCAPED and must stay that way. grep -E reads
      # a backslash-escaped pipe as a literal '|', not alternation — the pattern would
      # then match nothing and this gate would pass forever without checking. See
      # brief.md § "The no-traversal-logic CI step, verbatim".
      - name: GameUITesting contains no traversal logic
        run: |
          COUNT=$(find Sources/GameUITesting -name '*.swift' | wc -l)
          [ "$COUNT" -gt 0 ] || { echo "ERROR: gate found no .swift files under Sources/GameUITesting/ — it cannot have checked anything"; exit 1; }
          HITS=$(find Sources/GameUITesting -name '*.swift' -exec grep -nE 'as\? *(any )?(ContainerView|ZStackView|AnyButton|HasFrameSize|AnyDirectionalPaddingModifier|ChildrenProviding)' {} + || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "ERROR: GameUITesting casts to a child-bearing protocol — a fourth dispatch chain."
            echo "Traversal belongs in Sources/GameUI/ViewTraversal.swift, which the registry check covers."
            exit 1
          fi
          echo "OK — no dispatch casts in GameUITesting ($COUNT files checked)"

  test-linux:
    name: Build + test (Linux ARM64)
    runs-on: docker
    container: swift:6.2
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf ./* ./.[!.]* 2>/dev/null || true
          HOST="${GITHUB_SERVER_URL#https://}"
          if [ -n "$TOKEN" ]; then CREDS="x-access-token:${TOKEN}@"; else CREDS=""; fi
          git clone "https://${CREDS}${HOST}/${GITHUB_REPOSITORY}.git" .
          git checkout -q "${GITHUB_SHA}"
          git log -1 --oneline

      - run: swift --version
      - name: Build
        run: swift build --build-tests
      # Catches a regression of GameUITesting to a .testTarget or a reintroduced
      # `@testable import GameUI`: both compile fine under --build-tests and both
      # break every downstream consumer. See brief.md § Architectural Enforcement.
      - name: Build GameUITesting as a release library product
        run: swift build -c release --product GameUITesting
      - name: Test
        run: swift test

  test-macos:
    name: Build + test (macOS ARM64)
    runs-on: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - run: swift test
