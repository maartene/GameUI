schema_version: "0.1"
# SSOT — "what we promise the system does."
#
# NOTE (2026-07-22): these rows were written by hand rather than via
# `nwave-ai outcomes register`. That command is broken in nwave-ai 3.13.0 —
# `registry_service._SCHEMA_PATH` resolves to
# `<site-packages>/docs/product/outcomes/schema.json`, a path that exists only in
# the nwave-ai source repo, and `schema.json` is not shipped in the distribution.
# Every `register` invocation raises FileNotFoundError. `outcomes check-delta`
# is unaffected (it does not schema-validate). Key order below matches
# `nwave_ai.outcomes.domain.serialization.outcome_to_dict`.
outcomes:
  - id: OUT-1
    kind: operation
    summary: Declare a display-only horizontal progress bar with caller-chosen fill and track colours
    feature: progress-bar
    inputs:
      - shape: "value: Float"
      - shape: "label: String"
      - shape: "fillColor: Color = .green"
      - shape: "trackColor: Color = .darkGray"
    output:
      shape: "ProgressBar (View, Body == Never); LayoutEngine.layout yields a childless node filling the constraint box"
    keywords:
      - progressbar
      - progress
      - bar
      - fill
      - track
      - display-only
      - leaf-view
    artifact: Sources/GameUI/ProgressBar.swift
    related: []
    superseded_by: null

  - id: OUT-2
    kind: invariant
    summary: Progress bar fill fraction is total over the Float domain and never exceeds its track
    feature: progress-bar
    inputs:
      - shape: "any Float, including NaN, +/-infinity and subnormals"
    output:
      shape: "ProgressBar.clampedValue in 0.0...1.0; identity for in-range input; NaN maps to 0.0"
    keywords:
      - clamp
      - clamped
      - nan
      - progressbar
      - fill-fraction
      - bounds
      - safety
    artifact: Tests/GameUITests/acceptance/ProgressBarSlice2ValueSafetyTests.swift
    related: []
    superseded_by: null
